<!DOCTYPE html>
<html>
    <head>
        <title>
            patient's board
        </title>
     <style>
        body{
            background-color:#fdeeee;
            font-family: arial,sans-serif;
            color:red;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h1{
            font-size: 20px;
        }
        .header{
            left: 0;
            right: 0;
            top: 0;
            height: 50px;
            position: fixed;
            align-items: center;
            text-align: center;
            background-color:white;
            z-index: 1;
            border-radius: 10px ;

         }
        .side-bar{
            top:0;
            bottom: 0;
            left: 0;
            width: 150px;
            position: fixed;
            display: flex;
            flex-direction: column;
            border-right: color red;
            background-color:white;
            border-radius: 10px;

        }
        .blood-icon{
            margin-top: 100px;
            align-items: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 30px; 
            cursor: pointer;
            
        }
        .blood-icon:hover{
              color:white;
            background-color:rgb(247, 103, 103);
            transition: all ease 0.3s;
            border-radius: 50px;
        }
        .view-icon{
            margin-top: 100px;
            align-items: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size:50px ;
            cursor: pointer;
        }
        .view-icon:hover{
            color:white;
            background-color: rgb(247, 103, 103);
            transition: all ease 0.3s;
            border-radius: 50px;
            
        }
        .contact-icon{
            margin-top: 100px;
            align-items: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
        }
        .contact-icon:hover{
            color:white;
            background-color: rgb(247, 103, 103);
            transition: all ease 0.3s;
            border-radius: 50px;
    
        }
        p{
            font-size: 17px;
            text-align: center;
            
        }
        .welcome{
            padding-top: 50px;
            text-align: center;
        }
        .sub-title{
            color: rgb(186, 185, 185);
            margin-top: 0;
            font-family: italic;
            text-align: center;
        }
        .donor-box{
            height: 125px;
            width: 400px;
            flex-direction: row;
            align-items: center;
            background-color:#ffffff;
            margin: 20px;
            border-top-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .title1{
        color: rgb(186, 185, 185);
        text-align: center;
        }
        .title2{
            text-align: center;
        }
        button{
            border-radius: 8px;
            padding: 5px 2px 5px 2px;
            border: solid red ;
            background-color:red;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
     </style>
    </head>
    <body>
       
        <div class="header">
            <h1 >Patient's board</h1>
        </div>
        <div class="side-bar">
           <a href="requestblood.html" style="text-decoration: none;color:red";> <div class="blood-icon" onclick="">&#127973;
               <p> Request blood </p>
            </div></a>
            <div class="view-icon" onclick="viewdonors()">&#128065;
               <p> View Donor(s)</p>
            </div>
            <div class="contact-icon" onclick="viewcontact()">&#128222;
                <p>  added contact</p>
            </div>
        </div>
        <h1 class="welcome">Welcome Back!</h1>
        <p class="sub-title">Find available donors  make a blood request and view donors added contact</p>
        <div class="donor-box">
           <p class="title1"> are you a donor ? </p>
            <p class="title2">click here &#10140; <a href="donor.html"><button>Donors page</button></p></a>
        </div>
        <div id="response"></div>
    </body>
</html>
<script>
    async function viewdonors(){
        let user_id = localStorage.getItem("user_id");
        const response = await fetch("https://blood-donation-webapp-0gig.onrender.com/view-donors?user_id=" + user_id);
        const data = await response.json();
        if(!data.success){
             document.getElementById("response").innerHTML = data.message;
            return;
        }
          document.getElementById("response").innerHTML = data.data.map(donor => `
         <div style=" margin:10px; width:370px;border-radius:8px; padding:15px; color:white; background-color:black">
            <b> Donor's name: </b>  ${donor.name}<br>
            <b> Donor's blood-type:</b>  ${donor.blood_type}<br>
            <b> Donor's sub-division:</b> ${donor.sub_division}<br>  
            <b> Donor's quarter:</b> ${donor.quarter}<br>
            <b> Donor's Contact:</b> ${donor.phone}
            </div>
            `).join('');
         }
             async function viewcontact(){
        let user_id = localStorage.getItem("user_id");
        const response = await fetch("https://blood-donation-webapp-0gig.onrender.com/view-contacts?user_id=" + user_id);
        const data = await response.json();
            if(!data.success){
             document.getElementById("response").innerHTML = data.message;
            return;
        }
          document.getElementById("response").innerHTML = data.data.map(contact => `
         <div style=" margin:10px; width:370px;border-radius:8px; padding:15px; color:white; background-color:black">
            <b>Contact's name:</b>  ${contact.contact_name}<br>
             <b>Contact's blood-type:</b> ${contact.contact_blood_type}<br>
            <b>Contact's sub-divivsion:</b> ${contact.contact_sub_division}<br>  
           <b>Contact's quarter:</b>   ${contact.contact_quarter}<br>
            <b>Contact's phone:</b>   ${contact.contact_phone} 
            </div>
            `).join('');
         }
</script>
