<script>
async function register(){
    
        const validbloodtypes = ["A+","A-","B+","B-","O+","O-","AB+","AB-"];
        const validsubdivisions = ["Yaounde 1","Yaounde 2","Yaounde 3","Yaounde 4","Yaounde 5","Yaounde 6","Yaounde 7","Bafia","Mbalmayo","Obala","Akonolinga","Monatele","Eseka","Nanga-Eboko","Sa'a","Ndikinimeki","Yoko","Douala 1","Douala 2","Douala 3","Douala 4","Douala 5","Douala 6","Edea 1","Edea 2","Nkongsamba 1","Nkongsamba 1","Nkongsamba 3","Loum","Yabassi","Manjo","Dizangue","Bafoussam 1","Bafoussam 2","Bafoussam 3","Dschang","Foumban","Mbouda","Bafang","Bagangte","Foumbot","Babam","Bandjoun","kumbo","Wum","Ndop","Bamenda 1","Bamenda 2","Bamenda 3","Fundong","Bali","Batibo","Mbengwi","Buea","Limbe 1","Limbe 2","Limbe 3","Kumba 1","Kumba 2","Kumba 3","Tiko","Muyuka","Mamfe","Mundemba","Ekondo-tit","Ebolowa 1","Ebolowa 2","Kribi 1","Kribi 2","Sangmelima","Ambam","Djoum","Meyomessala","Lolodorf","Bertoua 1","Bertoua 2","Batouri","Abong-Mbang","Yokadouma","Garoua-Boulai","Lomie","Messamena","Garoua 1","Garoua 2","Garoua 3","Guider","Poli","Lagdo","Tchollire","Figuil","Pitoa","Ngaroundere 1","Ngaroundere 2","Ngaroundere 3","Meiganga","Banyo","Tibati","Tignere","Bankim","Belel","Maroua 1","Maroua 2","Maroua 3","Kousseri","Yagoua","Mokolo","Mora","Kaele","Bogo","Guidiguis","Maga","Makari"];
        const validstatus = ["DONOR","PATIENT"];
    let name = document.getElementById('name').value;
    let email = document.getElementById('email').value;
    let password = document.getElementById('password').value;
    let blood_type = document.getElementById('blood').value;
    let sub_division = document.getElementById('sub_division').value;
    let quarter = document.getElementById('quarter').value;
    let phone = document.getElementById('phone').value;
    let status = document.getElementById('role').value;

    if (!name || !email || !password || !blood_type || !sub_division || !quarter || !phone || !status){
        document.getElementById('response').textContent = 'Fill in all the fields !';
        return;
    }
    if (!validbloodtypes.includes(blood_type)){
        document.getElementById('response').textContent = 'please fill blood type as in the list !';
        return;
    }
    if (!validsubdivisions.includes(sub_division)){
        document.getElementById('response').textContent = 'please fill in sub-division as in the list !';
        return;
    }
    if(!validstatus.includes(status)){
        document.getElementById('response').textContent = 'please fill in status as in the list !';
        return;
    }
    const response = await fetch('http://localhost:3000/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, email, password, blood_type, sub_division, quarter, phone, status})
   });
   const data = await response.json();
   document.getElementById('response').textContent = data.message || data.error;
} 

</script>
