<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blood Connect | Log In</title>

  <!-- Reuses the same CSS file as the sign-in page -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- LEFT SIDE: same branding panel as sign-in -->
    <div class="brand-panel">
      <div class="brand-content">
        <div class="drop-icon">🩸</div>
        <h1>Blood Connect</h1>
        <p>Connecting donors and patients, one drop at a time.</p>
      </div>
    </div>

    <!-- RIGHT SIDE: the login form -->
    <div class="form-panel">
      <form id="loginForm" class="signin-form" novalidate>
        <h2>Welcome back</h2>
        <p class="subtitle">Log in to your account</p>

        <!-- Full name -->
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" placeholder="e.g. Sara Amrani" />
          <span class="error-message" id="error-fullName"></span>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" />
          <span class="error-message" id="error-password"></span>
        </div>

        <button type="submit" class="submit-btn">Log In</button>

        <p class="switch-link">
          Don't have an account? <a href="index.html">Sign in here</a>
        </p>

        <!-- Success message, filled in by JS once login "succeeds" -->
        <p class="success-message" id="successMessage"></p>
      </form>
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
